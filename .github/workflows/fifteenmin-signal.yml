name: Segnale 15M XAUUSD (sperimentale)

# ATTENZIONE MINUTI: ogni 15 min = ~2000 esecuzioni/mese. Su repo PRIVATO
# supera i minuti gratis e puo' fermare TUTTI i workflow. Usare SOLO se il
# repository e' PUBBLICO (minuti illimitati) — nel codice non ci sono segreti.

on:
  schedule:
    - cron: "*/15 * * * 1-5"   # ogni 15 minuti, lun-ven (il codice filtra le ore di mercato)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  send-signal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt

      - name: Invia il segnale 15m (solo se LONG/SHORT)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py --interval 15m --only-signals

      - name: Salva il log dei segnali
        run: |
          git config user.name "signal-bot"
          git config user.email "bot@users.noreply.github.com"
          git add signals_log.csv || true
          if git diff --cached --quiet; then
            echo "Nessuna modifica al log."
          else
            git commit -m "log: aggiorna risultati segnali (15m)"
            git pull --rebase origin main || true
            git push || true
          fi
