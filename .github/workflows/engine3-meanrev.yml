name: Motore BOT 3 sperimentale (Breakout 1H)

on:
  schedule:
    - cron: "0 */5 * * *"   # rete di sicurezza
  workflow_dispatch: {}

concurrency:
  group: engine3            # gruppo separato: non tocca bot 1 e bot 2
  cancel-in-progress: true

permissions:
  contents: write
  actions: write            # auto-riavvio

env:
  PROFILE: "brk"
  PROFILE_LABEL: "BOT 3 SPERIMENTALE · Breakout 15m/1h/4h + trailing · solo osservazione"
  STRATEGY: "breakout"
  ENGINE_TIMEFRAMES: "15m,1h,4h"   # piu trade: breakout+trailing positivo su tutti (test)
  RISK_REWARD: "1.5"
  ATR_SL_MULT: "1.5"
  DONCHIAN_N: "20"
  TRAILING_ATR: "3.0"   # uscita dinamica: lascia correre i vincitori
  MAX_BARS: "60"        # piu spazio al trailing per correre
  ACCOUNT_BALANCE: "10000"
  RISK_PERC: "0.75"

jobs:
  engine3:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Avvia il motore sperimentale
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID_3 }}   # canale 3 dedicato
          PYTHONUNBUFFERED: "1"
        run: |
          git config user.name "signal-bot"
          git config user.email "bot@users.noreply.github.com"
          python engine.py
      - name: Auto-riavvio (catena)
        if: always()
        run: |
          for i in 1 2 3; do
            curl -sf -X POST \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/engine3-meanrev.yml/dispatches" \
              -d '{"ref":"main"}' && { echo "re-dispatch OK"; break; } || { echo "tentativo $i fallito"; sleep 5; }
          done
