name: Motore BOT 3 (Mix bot1+bot2, scaglioni)

on:
  schedule:
    - cron: "0 */5 * * *"   # rete di sicurezza
  workflow_dispatch: {}

concurrency:
  group: engine3            # gruppo separato: non tocca bot 1 e bot 2
  cancel-in-progress: true

permissions:
  contents: write
  actions: write            # auto-riavvio

env:
  PROFILE: "mix"
  PROFILE_LABEL: "BOT 3 · MIX (meglio di bot 1+2) · scaglioni 1.5R+2.0R · DEMO 500$"
  STRATEGY: "trend"
  # timeframe: come bot 1/2 (tutti) -> nessun ENGINE_TIMEFRAMES
  RISK_REWARD: "1.5"
  ATR_SL_MULT: "1.5"
  EMA_TREND: "200"
  SCALE_OUT: "1"        # uscita a scaglioni (versione B pura)
  SCALE_T1: "1.5"       # 1o target: meta' posizione (come bot 1)
  SCALE_T2: "2.0"       # 2o target: l'altra meta' (come bot 2)
  MAX_BARS: "60"
  MAX_DAILY_LOSSES: "3" # freno come bot 1/2
  NOTIFY_CLOSED: "1"    # messaggio Telegram a ogni trade chiuso
  ACCOUNT_BALANCE: "500"
  RISK_PERC: "0.75"

jobs:
  engine3:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Avvia il motore sperimentale
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID_3 }}   # canale 3 dedicato
          PYTHONUNBUFFERED: "1"
        run: |
          git config user.name "signal-bot"
          git config user.email "bot@users.noreply.github.com"
          python engine.py
      - name: Auto-riavvio (catena)
        if: always()
        run: |
          for i in 1 2 3; do
            curl -sf -X POST \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/engine3-meanrev.yml/dispatches" \
              -d '{"ref":"main"}' && { echo "re-dispatch OK"; break; } || { echo "tentativo $i fallito"; sleep 5; }
          done
