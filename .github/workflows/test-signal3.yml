name: BOT 3 - Segnale di PROVA (canale 3)

on:
  workflow_dispatch: {}

env:
  PROFILE: "rev"
  PROFILE_LABEL: "BOT 3 SPERIMENTALE · RSI(2) reversion"
  STRATEGY: "meanrev"
  RISK_REWARD: "2.0"
  ACCOUNT_BALANCE: "10000"
  RISK_PERC: "1.0"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Prova nel canale 3
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID_3 }}
        run: python main.py --test
