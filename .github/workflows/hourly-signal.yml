name: Segnale orario XAUUSD (1H)

on:
  schedule:
    # Solo nella finestra di mercato XAUUSD (orari UTC, il codice ha comunque
    # un controllo di sicurezza su orari di chiusura/rollover).
    - cron: "5 22,23 * * 0"   # domenica sera: riapertura (~22:00 UTC)
    - cron: "5 * * * 1-4"     # lun-gio: ogni ora
    - cron: "5 0-20 * * 5"    # venerdi: fino a ~21:00 UTC (poi chiude)
  workflow_dispatch: {}   # avvio manuale dal sito

jobs:
  send-signal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"          # riusa le dipendenze: esecuzioni piu' veloci, meno minuti
      - run: pip install -r requirements.txt
      - name: Invia il segnale 1h (solo se LONG/SHORT)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py --interval 1h --only-signals
