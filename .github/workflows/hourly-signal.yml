name: Segnale orario XAUUSD (1H)

on:
  schedule:
    # Solo nella finestra di mercato XAUUSD (orari UTC, il codice ha comunque
    # un controllo di sicurezza su orari di chiusura/rollover).
    - cron: "5 22,23 * * 0"   # domenica sera: riapertura (~22:00 UTC)
    - cron: "5 * * * 1-4"     # lun-gio: ogni ora
    - cron: "5 0-20 * * 5"    # venerdi: fino a ~21:00 UTC (poi chiude)
  workflow_dispatch: {}   # avvio manuale dal sito

permissions:
  contents: write   # per salvare (commit) il log dei segnali nel repo

jobs:
  send-signal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt

      - name: Invia il segnale 1h (solo se LONG/SHORT)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py --interval 1h --only-signals

      - name: Salva il log dei segnali
        run: |
          git config user.name "signal-bot"
          git config user.email "bot@users.noreply.github.com"
          git add signals_log.csv || true
          if git diff --cached --quiet; then
            echo "Nessuna modifica al log."
          else
            git commit -m "log: aggiorna risultati segnali (1h)"
            git pull --rebase origin main || true
            git push || true
          fi
