name: Segnale 4H XAUUSD (sperimentale)

on:
  # Lo scheduling e' gestito dal motore always-on (engine.yml). Qui resta l'avvio manuale.
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  send-signal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt

      - name: Invia il segnale 4h (solo se LONG/SHORT)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py --interval 4h --only-signals

      - name: Salva il log dei segnali
        run: |
          git config user.name "signal-bot"
          git config user.email "bot@users.noreply.github.com"
          git add signals_log.csv sent_state.json || true
          if git diff --cached --quiet; then
            echo "Nessuna modifica al log."
          else
            git commit -m "log: aggiorna risultati segnali (4h)"
            git pull --rebase origin main || true
            git push origin HEAD:main || true
          fi
