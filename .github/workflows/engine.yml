name: Motore segnali (always-on)

on:
  schedule:
    - cron: "0 */5 * * *"   # rete di sicurezza (i cron di GitHub sono inaffidabili)
  workflow_dispatch: {}
  push:
    branches: [main]        # (temporaneo) avvio + test della catena

concurrency:
  group: engine
  cancel-in-progress: true

permissions:
  contents: write
  actions: write            # per auto-riavviarsi (workflow_dispatch via API)

jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      ENGINE_MAX_SECONDS: "120"   # TEST: ciclo breve per verificare la catena
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Avvia il motore
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: |
          git config user.name "signal-bot"
          git config user.email "bot@users.noreply.github.com"
          python engine.py
      - name: Auto-riavvio (catena)
        if: always()
        run: |
          for i in 1 2 3; do
            curl -sf -X POST \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/engine.yml/dispatches" \
              -d '{"ref":"main"}' && { echo "re-dispatch OK"; break; } || { echo "tentativo $i fallito"; sleep 5; }
          done
