name: Segnale giornaliero XAUUSD

on:
  schedule:
    # 06:00 UTC = 08:00 ora italiana (estate) / 07:00 (inverno), da lun a ven.
    # NB: GitHub usa sempre UTC e puo' ritardare di qualche minuto.
    - cron: "0 6 * * 1-5"
  workflow_dispatch: {}   # permette anche l'avvio manuale dal sito GitHub

permissions:
  contents: write   # per salvare (commit) il log dei segnali nel repo

jobs:
  send-signal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt

      - name: Invia il segnale su Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Salva il log dei segnali
        run: |
          git config user.name "signal-bot"
          git config user.email "bot@users.noreply.github.com"
          git add signals_log.csv || true
          if git diff --cached --quiet; then
            echo "Nessuna modifica al log."
          else
            git commit -m "log: aggiorna risultati segnali"
            git pull --rebase origin main || true
            git push || true
          fi
