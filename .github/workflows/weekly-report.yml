name: Report settimanale paper-trading

on:
  schedule:
    - cron: "0 17 * * 5"   # venerdi 17:00 UTC (a mercato quasi chiuso)
  workflow_dispatch: {}
  push:
    branches: [main]       # (temporaneo) invia subito report+storico

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Invia il report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python report.py
