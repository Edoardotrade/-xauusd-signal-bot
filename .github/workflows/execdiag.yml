name: Diagnostico esecuzione

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Diagnostico
        env:
          CAPITAL_API_KEY: ${{ secrets.CAPITAL_API_KEY }}
          CAPITAL_IDENTIFIER: ${{ secrets.CAPITAL_IDENTIFIER }}
          CAPITAL_PASSWORD: ${{ secrets.CAPITAL_PASSWORD }}
          CAPITAL_ACCOUNT_ID: ${{ secrets.CAPITAL_ACCOUNT_ID }}
          PYTHONUNBUFFERED: "1"
        run: python broker_execdiag.py
      - name: Salva diag
        run: |
          git config user.name "signal-bot"
          git config user.email "bot@users.noreply.github.com"
          git add diag.txt
          git commit -m "diag esecuzione" || echo "nessuna modifica"
          git pull --rebase origin main || true
          git push origin HEAD:main || true
